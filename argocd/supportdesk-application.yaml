apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supportdesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/singireddyshreyas/devops-csp.git
    targetRevision: main
    path: helm/taskboard
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: backend.image
          value: ghcr.io/singireddyshreyas/supportdesk-backend
        - name: frontend.image
          value: ghcr.io/singireddyshreyas/supportdesk-frontend
        - name: backend.tag
          value: ad160c3b96179586d17a4f68f6fce7afa203d9dc
        - name: frontend.tag
          value: ad160c3b96179586d17a4f68f6fce7afa203d9dc
        - name: ingress.host
          value: a6851dab66b604e8dad528d9eb9b5843-499584160.ap-south-1.elb.amazonaws.com
        - name: postgres.storageClass
          value: gp3
  destination:
    server: https://kubernetes.default.svc
    namespace: supportdesk
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
