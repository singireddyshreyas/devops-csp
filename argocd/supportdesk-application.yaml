apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supportdesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/singireddyshreyas/devops-csp.git
    targetRevision: main
    path: helm/taskboard
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: backend.image
          value: ghcr.io/singireddyshreyas/supportdesk-backend
        - name: frontend.image
          value: ghcr.io/singireddyshreyas/supportdesk-frontend
        - name: backend.tag
          value: 23a4748d4068567ae5288cc88a392572516f9b3b
        - name: frontend.tag
          value: 23a4748d4068567ae5288cc88a392572516f9b3b
  destination:
    server: https://kubernetes.default.svc
    namespace: supportdesk
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
