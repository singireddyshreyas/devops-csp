apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "supportdesk.fullname" . }}-frontend, labels: {app: supportdesk-frontend}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: supportdesk-frontend}}
  template:
    metadata: {labels: {app: supportdesk-frontend}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
        ports: [{containerPort: 8080}]
        env:
        - name: BACKEND_HOST
          value: "{{ include "supportdesk.fullname" . }}-backend:8000"
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
