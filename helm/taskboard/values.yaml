frontend:
  image: ghcr.io/singireddyshreyas/supportdesk-frontend
  tag: dev
backend:
  image: ghcr.io/singireddyshreyas/supportdesk-backend
  tag: dev
replicaCount: 2
namespace: supportdesk
imagePullSecrets: []
postgres:
  host: supportdesk-postgres
  database: supportdesk
  username: supportdesk
  password: supportdesk
ingress:
  enabled: false
  host: supportdesk.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
