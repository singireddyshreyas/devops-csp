name: SupportDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    name: Build, scan, and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Calculate GHCR image names
        id: images
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/$owner/supportdesk-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/supportdesk-frontend" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -t "${{ steps.images.outputs.backend }}:${GITHUB_SHA}" ./backend

      - name: Build frontend image
        run: docker build -t "${{ steps.images.outputs.frontend }}:${GITHUB_SHA}" ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SHA-tagged images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.images.outputs.backend }}:${GITHUB_SHA}"
          docker push "${{ steps.images.outputs.frontend }}:${GITHUB_SHA}"

  deploy:
    name: Deploy with Helm to EKS (opt-in)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EKS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"

      - name: Calculate GHCR image names
        id: images
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/$owner/supportdesk-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/supportdesk-frontend" >> "$GITHUB_OUTPUT"

      - name: Deploy SupportDesk Helm release
        run: |
          helm upgrade --install supportdesk ./helm/taskboard \
            --namespace supportdesk \
            --create-namespace \
            -f ./helm/taskboard/values-prod.yaml \
            --set-string backend.image="${{ steps.images.outputs.backend }}" \
            --set-string backend.tag="${GITHUB_SHA}" \
            --set-string frontend.image="${{ steps.images.outputs.frontend }}" \
            --set-string frontend.tag="${GITHUB_SHA}" \
            --wait --timeout 10m
